schema_version: code_inventory_v1
cataloged_at: "2026-08-28"
repository: gendiff-data-process
branch: organize/finalize-project-organization-20260828
code_snapshot_commit: ddd7a68685042dc93331a105d0f8b7449c8e467a
classification_rule: "current 需要正式下游运行证据；仅因文件较新不能标为 current"

status_definitions:
  current: 已确认属于当前生产链路
  candidate: 最近开发且可能接替旧链路，但尚未完成全链验证
  legacy: 历史流程，保留用于解释已有数据
  support: 检查、转换、复制、统计或目录工具
  experiment: smoke、测试或一次性探索脚本
  unknown: 暂时无法确认用途或上下游
  deprecated: 已有明确候选替代者，待迁移验收后归档

