schema_version: pipeline_catalog_v1
pipeline_id: history_area_edit_v2
status: blocked_target
confidence: medium
purpose: 记录已观测 GenDiff packed area-v2 consumer 与计划中的统一 canonicalizer 接口

observed_consumer_contract:
  evidence_manifest: catalog/training_consumer_manifest.yaml
  audit: docs/TRAINING_CONSUMER_AUDIT.md
  training_repository: /mnt/d/projects/GenDiff
  inspected_checkout_commit: c6bcd8fda184dfa4042c8158a8fd8c797fb57fbc
  historical_run_commit: unknown
  run_command: python train.py --config configs/packed_area_edit_v2_tiny_overfit.yaml --train --gpu 0,1,2,3,4,5,6
  run_config_sha256: 6b61d262991fec4ec3b1787385a3f0fb0d074dddd87f3f0dd1acb9317ae40441
  loader: /mnt/d/projects/GenDiff/craftsman/data/packed_area_edit_v2_data_module.py
  dataset_root: /mnt/d/projects/GenDiff/datasets/history_area_edit_v2_packed
  pack_schema: area_v2_packed_v1
  edit_schema: area_v2_absolute_target_coord_no_anchor
  split_status: train_val_test_alias_same_20000_samples

expected_contract:
  input:
    - source building layers with stable semantic/geometry identifiers
    - target building layers
    - optional construction lineage metadata
  canonicalizer:
    - normalize coordinate precision and units
    - normalize polygon winding and choose a unique cyclic start vertex
    - sort layers and components by stable geometry keys
    - resolve symmetry ties with explicit deterministic tie-breakers
    - produce stable layer, edge, point, and operation IDs
    - emit one canonical edit order per equivalent transformation
  output:
    - canonical edit object
    - deterministic token/value sequence
    - provenance and validation report

candidate_implementation:
  script_id: construction.canonical_edit_dataset.v1
  path: building_process/generate_construction_sequence_canonical_edit_dataset.py
  introducing_commit: b4c15a89852df01c836dded8aef75a6d5b320bb2
  direct_observed_loader_compatibility: blocked
  required_adapter: canonical_edit_v3_to_area_v2_absolute_target_coord_no_anchor
  adapter_status: unknown_missing

required_invariants:
  - canonicalize(x) == canonicalize(equivalent_permutation(x))
  - apply(source, compile(canonicalize(source, target))) geometrically equals target
  - repeated runs with the same input/seed are byte-identical
  - every training sample key maps to exactly one canonical target sequence
  - collisions and ambiguous matches fail closed and are reported

missing_evidence:
  - 历史 training run 的 Git commit、dirty diff hash 与完整环境
  - packed dataset 的 exact generation/packing command、producer commit 与 dirty diff hash
  - history_stages/area 数据的确切 producer command
  - canonical key 冲突率、round-trip 失败率和训练可学性统计
  - canonical_edit_v3 到现有 area-v2 schema 的 reviewed adapter 与 golden tests
