unresolved_risks:
  - 小型等价变换 fixture 已通过，但全数据 canonical edit 唯一性尚未验证
  - layer/point 排序、对称 footprint、浮点容差和 nearest-match 可能造成一对多表示
  - 未对完整数据集执行 canonicalize -> apply -> compare round-trip
  - Phase 2 已有显式 versioned adapter 并通过小型 loader smoke，但旧 construction producer 尚未迁移且真实 release 未验证
  - 候选 output run 的 exact command/config/commit 与实际 consumers 仍为 unknown
  - 项目默认 uv 环境仍不是正式训练环境；Phase 2 smoke 使用已观测 gendiff Python，release environment 尚未批准
  - 当前 48 个 mixed transition 的业务语义与上游修复方式为 unknown
  - 已审计 GenDiff loader 不消费独立 change_kind 通道，XYZ + source 的拆除可学性为 unknown

promotion_gate:
  - 固定输入和 seed 重复运行，逐字节比较 canonical outputs
  - 对顶点循环移位、反向、layer 顺序置换和微小浮点扰动做等价性测试
  - 全量 round-trip 后几何误差为零或低于显式阈值
  - 统计 duplicate canonical key、冲突 target 和无法匹配 lineage
  - 在 fresh environment 中用训练 loader 读取并完成小批过拟合测试
