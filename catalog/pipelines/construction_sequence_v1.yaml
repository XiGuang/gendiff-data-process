  evidence_manifest: catalog/training_consumer_manifest.yaml
  audit: docs/TRAINING_CONSUMER_AUDIT.md
  training_repository_checkout_commit: c6bcd8fda184dfa4042c8158a8fd8c797fb57fbc
  historical_run_commit: unknown
  loader: /mnt/d/projects/GenDiff/craftsman/data/packed_area_edit_v2_data_module.py
